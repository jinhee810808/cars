    <script>
        function makeLeft(x) {
            var trArray = [0, 5, 10, 15, 20];
            var closeTrArray = [4, 9, 14, 19, 24];
            let leftTable = '';
            for (var j = 0; j < 25; j++) {
                if (trArray.includes(j)) {
                    leftTable += `<tr><td class='tdLeft'><font size='${leftfontsize}'><font color='grey'>${x[j]}</td>`;
                } else if (closeTrArray.includes(j)) {
                    leftTable += `<td class='tdLeft'><font size='${leftfontsize}'><font color='grey'>${x[j]}</td></tr>`;
                } else {
                    leftTable += `<td class='tdLeft'><font size='${leftfontsize}'><font color='grey'>${x[j]}</td>`;
                }
            }
            return leftTable;
        }

        function makeRight(i) {
            var trArray = [1, 6, 11, 16, 21, 26, 31, 36, 41, 46];
            var closeTrArray = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50];
            var rightTable = '';
            for (var x = 1; x < 51; x++) {
                if ((trArray.includes(x)) && (i.includes(x))) {
                    rightTable += "<tr><td width='" + righttdwidth + "'><font Color = 'red'><font size='" + rightfontsize + "'>" + x + "</td>";
                } else if ((closeTrArray.includes(x)) && (i.includes(x))) {
                    rightTable += "<td width='" + righttdwidth + "'><font Color = 'red'><font size='" + rightfontsize + "'>" + x + "</td></tr>";
                } else if (i.includes(x)) {
                    rightTable += "<td width='" + righttdwidth + "'><font Color = 'red'><font size='" + rightfontsize + "'>" + x + "</td>";
                } else if (trArray.includes(x)) {
                    rightTable += "<tr><td width='" + righttdwidth + "'><font Color = 'grey'><font size='" + rightfontsize + "'>" + x + "</td>";
                } else if (closeTrArray.includes(x)) {
                    rightTable += "<td width='" + righttdwidth + "'><font Color = 'grey'><font size='" + rightfontsize + "'>" + x + "</td></tr>";
                } else {
                    rightTable += "<td width='" + righttdwidth + "'><font Color = 'grey'><font size='" + rightfontsize + "'>" + x + "</td>";
                }
            }

            return rightTable;
        }

        function check(i) {
            let coment;
            if (i.includes(essential_number)) {
                comment = "/* " + essential_number + "은 지우고 시작하세요. klassauto.com";
            } else {

            return comment;

        var bingo = [];
        var essential_number = 1;
        var leftfontsize = 5;
        var rightfontsize = 4;
        var leftdwidth = 32;
        var righttdwidth = 32;
        let gameCount;
        let title;

        let today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() + 1;
        let date = today.getDate();
        let hour = today.getHours();
        let minute = today.getMinutes();
        let second = today.getSeconds();

        let footer = `<footer class="" style="height:25%;text-align:center;">

        $(document).ready(function () {
            gameCount = prompt('게임인원은 총 몇명인가요?');
            gameCount = Number(gameCount);

            if (gameCount < 0) {
                alert('게임인원은 반드시 1명 이상이어야 합니다.')
                return false;
            } else if (gameCount > 20) {
                alert('최대 20명 출력입니다.');
                return false();
            } else if (gameCount >= 1) {
                alert('총 ' + gameCount + '개의 게임이 출력됩니다 :)');
            } else {
                alert('숫자를 입력해야만 합니다.^^;')
                return false;
            }

            for (var i = 0; i < gameCount; i++) {
                let bingoGame = [];

                for (var j = 0; j < 3; j++) {
                    let bingoGameEle = [];
                    do {
                        var inputNum = Math.floor(Math.random() * 50 + 1);
                        if (!(bingoGameEle.includes(inputNum))) {
                            bingoGameEle.push(inputNum);
                        }
                    } while (bingoGameEle.length < 25); //빙고배열생성

                    var replaceIndex = Math.floor(Math.random() * 25); //essential_number 포함
                    if (!(bingoGameEle.includes(essential_number))) {
                        bingoGameEle.splice(replaceIndex, 1, essential_number);
                    }
                    bingoGame.push(bingoGameEle);
                    // console.log(bingoGameEle);
                }
                bingo.push(bingoGame);
            }// 빙고배열 생성

            // console.log(bingo);

                  </div>`;

                $('#aaa').append(title);

                for (var y = 0; y < 3; y++) {

                        ordered[0] = "firstGame";
                        ordered[1] = "첫번째 게임";

                    } else {

                        ordered[1] = "세번째 게임";
                        ordered[2] = "<hr>";

                          </div>

                        ${ordered[2]}`;

                    // console.log(bingoxy);


                    $('#aaa').append(left);
                }
                // $('#aaa').append(footer);

            }

        })//document.ready }
